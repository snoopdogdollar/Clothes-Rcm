<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOTH-ATION | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; }
        .glass-card { background: #D1D1D1; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md">
        <h1 class="text-4xl font-black tracking-tighter uppercase text-center mb-2">CLOTH-ATION</h1>
        <p class="text-xs font-bold uppercase tracking-widest text-gray-500 text-center mb-10">Sign in to your wardrobe</p>

        <div class="glass-card p-10 shadow-xl">
            <form id="loginForm" class="space-y-6" onsubmit="handleLogin(event)">
                <div>
                    <label for="username" class="text-[10px] font-bold uppercase text-gray-500 block mb-2">Username</label>
                    <input type="text" id="username" name="username" required
                           class="w-full p-4 rounded-xl bg-gray-100 outline-none text-sm border-2 border-transparent focus:border-black transition"
                           placeholder="Admin username" autocomplete="username">
                </div>
                <div>
                    <label for="password" class="text-[10px] font-bold uppercase text-gray-500 block mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full p-4 rounded-xl bg-gray-100 outline-none text-sm border-2 border-transparent focus:border-black transition"
                           placeholder="Password" autocomplete="current-password">
                </div>
                <p id="loginError" class="text-red-500 text-xs font-bold uppercase hidden"></p>
                <button type="submit" id="loginBtn"
                        class="w-full bg-black text-white py-4 rounded-xl text-sm font-bold uppercase tracking-widest hover:bg-gray-800 transition">
                    Sign in
                </button>
            </form>
        </div>

        <p class="text-[10px] text-gray-400 text-center mt-6 uppercase tracking-widest">
            Credentials are stored in the server .env file (ADMIN_USERNAME, ADMIN_PASSWORD).
        </p>
    </div>

    <script>
        // If already logged in, redirect to home
        if (isLoggedIn()) {
            window.location.href = 'index.html';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');

            errEl.classList.add('hidden');
            errEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const data = await login(username, password);
                if (data.token) {
                    setToken(data.token);
                    showSuccess('Welcome back!');
                    window.location.href = 'index.html';
                    return;
                }
                throw new Error('No token received');
            } catch (e) {
                errEl.textContent = e.message || 'Invalid username or password';
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        }
    </script>
</body>
</html>

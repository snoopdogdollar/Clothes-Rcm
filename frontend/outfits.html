<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOTH-ATION | Saved Outfits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
        if (!isLoggedIn()) { window.location.replace('login.html'); }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; }
        .glass-card { background: #D1D1D1; border-radius: 24px; }
        .outfit-card {
            background: #e5e5e5;
            border-radius: 20px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .outfit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: #d8d8d8;
        }

        .outfit-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 12px 20px 0 20px;
        }
        .outfit-slot {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .outfit-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .outfit-slot-top    { height: 140px; z-index: 3; position: relative; }
        .outfit-slot-bottom { height: 160px; z-index: 2; position: relative; margin-top: -20px; }
        .outfit-slot-shoes  { height: 80px;  z-index: 1; position: relative; margin-top: -12px; }

        .outfit-slot-empty {
            background: #d1d1d1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #9ca3af;
            width: 80%;
            height: 60%;
        }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: #D1D1D1; width: 100%; max-width: 500px;
            max-height: 90vh;
            border-radius: 32px; position: relative;
            animation: modalFadeIn 0.3s ease-out;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            flex-shrink: 0; padding: 24px 24px 12px 24px; position: relative;
        }
        .modal-body {
            flex: 1; overflow-y: auto; padding: 0 24px;
            min-height: 0;
        }
        .modal-footer {
            flex-shrink: 0; padding: 16px 24px 24px 24px;
        }
        .close-modal {
            position: absolute; top: 20px; right: 20px;
            width: 36px; height: 36px; background: #1a1a1a;
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
        }

        .modal-name-display { padding: 2px 4px; margin: -2px -4px; border-radius: 6px; cursor: text; }
        .modal-name-display:hover .modal-name-text { text-decoration: underline; text-underline-offset: 4px; background: rgba(0,0,0,0.04); border-radius: 4px; }
        .modal-name-input {
            font-size: 1.25rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.025em;
            width: 100%; background: #f3f4f6; border: 2px solid #1a1a1a; border-radius: 8px;
            padding: 4px 8px; outline: none;
        }

        .detail-slot { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
        .detail-slot img { width: 60px; height: 60px; object-fit: contain; background: #e5e5e5; border-radius: 12px; padding: 4px; }
        .detail-slot-info { font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .detail-slot-sub { font-size: 9px; color: #6b7280; font-weight: 600; text-transform: uppercase; }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="flex justify-between items-center max-w-7xl mx-auto w-full mb-12">
        <h1 class="text-4xl font-black tracking-tighter uppercase cursor-pointer" onclick="window.location.href='index.html'">CLOTH-ATION</h1>
        <button onclick="window.location.href='dressing-room.html'" class="bg-black text-white px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-gray-800 transition">+ Create Outfit</button>
    </header>

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-4">
            <p id="totalCount" class="text-[10px] font-black uppercase text-gray-400">Saved Outfits: 0</p>
        </div>

        <div id="outfitsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">
                <div class="w-12 h-12 border-4 border-gray-200 border-t-black rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-sm uppercase font-bold">Loading outfits...</p>
            </div>
        </div>
    </div>

    <!-- Outfit Detail Modal -->
    <div id="outfitModal" class="modal-overlay" onclick="if(event.target.id==='outfitModal') closeModal()">
        <div class="modal-content shadow-2xl" onclick="event.stopPropagation()">

            <!-- HEADER (fixed) -->
            <div class="modal-header">
                <div class="close-modal" onclick="closeModal()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                </div>
                <div id="modal-name-wrapper">
                    <div id="modal-name-display" class="modal-name-display group flex items-center gap-2" title="Click to rename">
                        <span id="modal-name-text" class="modal-name-text text-xl font-black uppercase tracking-tight">Outfit</span>
                        <svg class="w-4 h-4 text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <input type="text" id="modal-name-input" class="modal-name-input" style="display:none" maxlength="120" placeholder="Outfit name...">
                </div>
                <p id="modalDate" class="text-[10px] font-bold uppercase text-gray-500 mt-1"></p>
            </div>

            <!-- SCROLLABLE BODY -->
            <div class="modal-body">
                <div class="flex flex-col items-center mb-4" id="modalStack"></div>
                <div id="modalSlots" class="border-t border-black/10 pt-4 space-y-1"></div>
            </div>

            <!-- FOOTER (fixed) -->
            <div class="modal-footer">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="wearOutfit()" class="bg-black text-white py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-gray-800 transition">Wear in Dressing Room</button>
                    <button onclick="confirmDeleteOutfit()" class="bg-gray-200 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition">Delete</button>
                </div>
            </div>

        </div>
    </div>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-[#e5e5e5]/90 backdrop-blur px-10 py-4 rounded-full shadow-xl border border-white/20 flex space-x-12">
        <a href="dressing-room.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Dressing Room</a>
        <a href="outfits.html" class="text-[10px] font-bold uppercase border-b-2 border-black">Outfits</a>
        <a href="wardrobe.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Wardrobe</a>
        <a href="index.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Home</a>
        <a href="#" onclick="logout(); return false;" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Logout</a>
    </nav>

    <script>
        let allOutfits = [];
        let currentOutfitDetail = null;

        window.addEventListener('DOMContentLoaded', loadOutfits);

        async function loadOutfits() {
            try {
                const data = await getOutfits();
                allOutfits = data.outfits;
                document.getElementById('totalCount').textContent = `Saved Outfits: ${data.total}`;
                renderOutfits(allOutfits);
            } catch (err) {
                console.error(err);
                document.getElementById('outfitsGrid').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-red-500 font-bold uppercase mb-4">Failed to load outfits</p>
                        <button onclick="loadOutfits()" class="bg-black text-white px-6 py-2 rounded-lg text-xs font-bold uppercase">Retry</button>
                    </div>`;
            }
        }

        function slotHtml(item, slotClass) {
            if (!item) {
                return `<div class="outfit-slot ${slotClass}"><div class="outfit-slot-empty">—</div></div>`;
            }
            return `<div class="outfit-slot ${slotClass}"><img src="${getItemImageUrl(item.id, 'segmented')}" alt="${getDisplayCategory(item.category) || ''}"></div>`;
        }

        function renderOutfits(outfits) {
            const grid = document.getElementById('outfitsGrid');
            if (outfits.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <p class="text-gray-400 font-bold uppercase mb-4">No saved outfits yet</p>
                        <button onclick="window.location.href='dressing-room.html'" class="bg-black text-white px-6 py-3 rounded-lg text-xs font-bold uppercase">Create Your First Outfit</button>
                    </div>`;
                return;
            }
            grid.innerHTML = '';
            outfits.forEach(outfit => {
                const card = document.createElement('div');
                card.className = 'outfit-card cursor-pointer';
                card.onclick = () => openOutfitDetail(outfit);

                const itemCount = [outfit.top, outfit.bottom, outfit.shoes].filter(Boolean).length;
                const name = outfit.name || `Outfit #${outfit.id}`;

                card.innerHTML = `
                    <div class="outfit-stack">
                        ${slotHtml(outfit.top, 'outfit-slot-top')}
                        ${slotHtml(outfit.bottom, 'outfit-slot-bottom')}
                        ${slotHtml(outfit.shoes, 'outfit-slot-shoes')}
                    </div>
                    <div class="p-4 pt-3">
                        <h4 class="text-sm font-black uppercase truncate">${escapeHtml(name)}</h4>
                        <p class="text-[10px] font-bold text-gray-400 uppercase">${itemCount} item${itemCount !== 1 ? 's' : ''} &bull; ${formatDate(outfit.created_at)}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // ==================== Detail Modal ====================

        function openOutfitDetail(outfit) {
            currentOutfitDetail = outfit;
            const name = outfit.name || `Outfit #${outfit.id}`;

            const nameText = document.getElementById('modal-name-text');
            const nameInput = document.getElementById('modal-name-input');
            const nameDisplay = document.getElementById('modal-name-display');
            nameText.textContent = name;
            nameInput.value = name;
            nameDisplay.style.display = 'flex';
            nameInput.style.display = 'none';

            document.getElementById('modalDate').textContent = `Saved ${formatDate(outfit.created_at)}`;

            const stack = document.getElementById('modalStack');
            stack.innerHTML = `
                ${slotHtml(outfit.top, 'outfit-slot-top')}
                ${slotHtml(outfit.bottom, 'outfit-slot-bottom')}
                ${slotHtml(outfit.shoes, 'outfit-slot-shoes')}
            `;

            const slots = document.getElementById('modalSlots');
            slots.innerHTML = '';
            [
                { label: 'Top', item: outfit.top },
                { label: 'Bottom', item: outfit.bottom },
                { label: 'Shoes', item: outfit.shoes },
            ].forEach(p => {
                if (!p.item) return;
                slots.innerHTML += `
                    <div class="detail-slot">
                        <img src="${getItemImageUrl(p.item.id, 'segmented')}" alt="">
                        <div>
                            <div class="detail-slot-info">${p.item.primary_color || ''} ${getDisplayCategory(p.item.category) || ''}</div>
                            <div class="detail-slot-sub">${p.label} &bull; ${p.item.material || 'Unknown material'}</div>
                        </div>
                    </div>`;
            });

            document.getElementById('outfitModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('outfitModal').style.display = 'none';
            currentOutfitDetail = null;
        }

        // ==================== Inline Name Editing ====================

        (function initNameEdit() {
            const display = document.getElementById('modal-name-display');
            const textEl = document.getElementById('modal-name-text');
            const input = document.getElementById('modal-name-input');

            display.addEventListener('click', e => {
                e.stopPropagation();
                input.value = textEl.textContent;
                display.style.display = 'none';
                input.style.display = 'block';
                input.focus();
                input.select();
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); saveName(); }
                else if (e.key === 'Escape') { e.preventDefault(); cancelName(); }
            });
            input.addEventListener('blur', () => cancelName());

            async function saveName() {
                const val = input.value.trim();
                if (!currentOutfitDetail) { cancelName(); return; }
                const fallback = `Outfit #${currentOutfitDetail.id}`;
                const newName = val || fallback;
                try {
                    await updateOutfitAPI(currentOutfitDetail.id, { name: val || null });
                    currentOutfitDetail.name = val || null;
                    textEl.textContent = newName;
                    loadOutfits();
                    showSuccess('Name updated');
                } catch (err) {
                    showError('Failed to rename');
                }
                input.style.display = 'none';
                display.style.display = 'flex';
            }

            function cancelName() {
                input.style.display = 'none';
                display.style.display = 'flex';
            }
        })();

        // ==================== Actions ====================

        async function confirmDeleteOutfit() {
            if (!currentOutfitDetail) return;
            if (!confirm('Delete this outfit?')) return;
            try {
                await deleteOutfitAPI(currentOutfitDetail.id);
                showSuccess('Outfit deleted');
                closeModal();
                loadOutfits();
            } catch (err) {
                showError('Failed to delete outfit');
            }
        }

        function wearOutfit() {
            if (!currentOutfitDetail) return;
            const params = new URLSearchParams();
            if (currentOutfitDetail.top_id) params.set('top', currentOutfitDetail.top_id);
            if (currentOutfitDetail.bottom_id) params.set('bottom', currentOutfitDetail.bottom_id);
            if (currentOutfitDetail.shoes_id) params.set('shoes', currentOutfitDetail.shoes_id);
            window.location.href = `dressing-room.html?${params.toString()}`;
        }
    </script>
</body>
</html>

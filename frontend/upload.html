<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOTH-ATION | Upload New Item</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/api.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; }
        .glass-card { background: #D1D1D1; border-radius: 24px; }
        .upload-area {
            border: 3px dashed #cbd5e1;
            border-radius: 24px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #1a1a1a;
            background: #f3f4f6;
        }
        .upload-area.dragover {
            border-color: #22c55e;
            background: #dcfce7;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #1a1a1a;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .color-swatch {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid rgba(0,0,0,0.1);
        }
        
        /* Marquee Animation */
        @keyframes marquee {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        
        .marquee-animation {
            animation: marquee 25s linear infinite;
        }
        
        .marquee-animation:hover {
            animation-play-state: paused;
        }
        
        .marquee-item {
            width: 128px;
            height: 128px;
            border-radius: 20px;
            margin-right: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .marquee-item:hover {
            transform: scale(1.05);
        }
        
        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen">

    <header class="flex justify-between items-center max-w-4xl mx-auto w-full mb-12">
        <h1 class="text-4xl font-black tracking-tighter uppercase cursor-pointer" onclick="window.location.href='index.html'">CLOTH-ATION</h1>
        <button onclick="window.location.href='wardrobe.html'" class="bg-gray-200 text-black px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-gray-300 transition">Back to Wardrobe</button>
    </header>

    <main class="max-w-4xl mx-auto">
        
        <!-- Upload Section -->
        <div id="uploadSection" class="glass-card p-10 mb-8">
            <h2 class="text-2xl font-black uppercase mb-6">Upload New Item</h2>
            
            <div id="uploadArea" class="upload-area p-12 flex flex-col items-center justify-center space-y-4" onclick="document.getElementById('fileInput').click()">
                <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <p class="text-sm font-bold uppercase tracking-wider">Drop image here or click to browse</p>
                <p class="text-xs text-gray-500 uppercase">Supports JPG, PNG, WEBP (max 10MB)</p>
            </div>
            
            <input type="file" id="fileInput" accept="image/*" style="display: none" onchange="handleFileSelect(event)">
            
            <!-- Preview selected file -->
            <div id="filePreview" style="display: none" class="mt-6 flex items-center justify-between bg-white p-4 rounded-xl">
                <div class="flex items-center space-x-4">
                    <img id="previewThumb" src="" class="w-16 h-16 object-cover rounded-lg">
                    <div>
                        <p id="fileName" class="text-sm font-bold"></p>
                        <p id="fileSize" class="text-xs text-gray-500"></p>
                    </div>
                </div>
                <button onclick="startProcessing()" class="bg-black text-white px-6 py-3 rounded-lg text-xs font-bold uppercase hover:bg-gray-800 transition">Process Image</button>
            </div>
        </div>

        <!-- Loading Section -->
        <div id="loadingSection" style="display: none" class="glass-card p-12 text-center">
            <div class="flex flex-col items-center space-y-6">
                <div class="spinner"></div>
                <h3 class="text-xl font-black uppercase">Processing Image...</h3>
                <p class="text-sm text-gray-600">Running AI Analysis (Segmentation → Classification → Color Extraction)</p>
            </div>
        </div>

        <!-- AI Results Section -->
        <div id="resultsSection" style="display: none" class="fade-in">
            <div class="glass-card p-10 mb-8">
                <h2 class="text-2xl font-black uppercase mb-6">AI Analysis Complete!</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Image Preview -->
                    <div class="bg-white rounded-xl p-6 flex items-center justify-center">
                        <img id="segmentedImage" src="" class="max-w-full max-h-[400px] object-contain">
                    </div>
                    
                    <!-- AI Results -->
                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] font-bold uppercase text-gray-500 block mb-2">Category</label>
                            <p id="aiCategory" class="text-2xl font-black uppercase"></p>
                            <p id="aiConfidence" class="text-xs text-gray-500 uppercase mt-1"></p>
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-bold uppercase text-gray-500 block mb-2">Primary Color</label>
                            <div class="flex items-center space-x-3">
                                <div id="primaryColorSwatch" class="color-swatch"></div>
                                <div>
                                    <p id="primaryColorName" class="text-lg font-black uppercase"></p>
                                    <p id="paletteType" class="text-xs text-gray-500 uppercase"></p>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-bold uppercase text-gray-500 block mb-3">Color Breakdown</label>
                            <div id="colorBreakdown" class="space-y-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Input Form -->
            <div class="glass-card p-10">
                <h2 class="text-2xl font-black uppercase mb-6">Add Details</h2>
                
                <form id="userDataForm" class="space-y-6" onsubmit="saveItemDetails(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="text-[10px] font-bold uppercase text-gray-500 block mb-2">Material</label>
                            <select id="material" class="w-full p-4 rounded-xl bg-gray-100 outline-none text-sm border-2 border-transparent focus:border-black transition appearance-none cursor-pointer">
                                <option value="">Select material...</option>
                                <option value="Cotton">Cotton</option>
                                <option value="Denim">Denim</option>
                                <option value="Leather">Leather</option>
                                <option value="Polyester">Polyester</option>
                                <option value="Silk">Silk</option>
                                <option value="Wool">Wool</option>
                                <option value="Linen">Linen</option>
                                <option value="Nylon">Nylon</option>
                                <option value="Spandex">Spandex</option>
                                <option value="Canvas">Canvas</option>
                                <option value="Velvet">Velvet</option>
                                <option value="Suede">Suede</option>
                                <option value="Synthetic">Synthetic</option>
                                <option value="Mixed">Mixed</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-bold uppercase text-gray-500 block mb-2">Size</label>
                            <select id="size" class="w-full p-4 rounded-xl bg-gray-100 outline-none text-sm border-2 border-transparent focus:border-black transition appearance-none cursor-pointer">
                                <option value="">Select size...</option>
                                <optgroup label="Letter Sizes">
                                    <option value="XXS">XXS</option>
                                    <option value="XS">XS</option>
                                    <option value="S">S</option>
                                    <option value="M">M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                    <option value="XXL">XXL</option>
                                    <option value="XXXL">XXXL</option>
                                </optgroup>
                                <optgroup label="Numeric Sizes">
                                    <option value="28">28</option>
                                    <option value="29">29</option>
                                    <option value="30">30</option>
                                    <option value="31">31</option>
                                    <option value="32">32</option>
                                    <option value="33">33</option>
                                    <option value="34">34</option>
                                    <option value="36">36</option>
                                    <option value="38">38</option>
                                    <option value="40">40</option>
                                    <option value="42">42</option>
                                </optgroup>
                                <optgroup label="Shoe Sizes">
                                    <option value="6">6</option>
                                    <option value="6.5">6.5</option>
                                    <option value="7">7</option>
                                    <option value="7.5">7.5</option>
                                    <option value="8">8</option>
                                    <option value="8.5">8.5</option>
                                    <option value="9">9</option>
                                    <option value="9.5">9.5</option>
                                    <option value="10">10</option>
                                    <option value="10.5">10.5</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                </optgroup>
                                <option value="One Size">One Size</option>
                                <option value="Free Size">Free Size</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 block mb-2">Notes</label>
                        <textarea id="notes" placeholder="Any additional notes..." rows="3"
                                  class="w-full p-4 rounded-xl bg-gray-100 outline-none text-sm border-2 border-transparent focus:border-black transition resize-none"></textarea>
                    </div>
                    
                    <div class="flex space-x-4">
                        <button type="submit" class="flex-1 bg-black text-white py-4 rounded-xl text-sm font-bold uppercase tracking-widest hover:bg-gray-800 transition">
                            Save to Wardrobe
                        </button>
                        <button type="button" onclick="resetUpload()" class="bg-gray-200 text-black px-6 py-4 rounded-xl text-sm font-bold uppercase hover:bg-gray-300 transition">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Saved Clothes Marquee -->
        <div class="glass-card p-6 mt-8">
            <p class="text-xs font-bold uppercase tracking-widest opacity-50 mb-4">Saved clothes</p>
            <div class="overflow-hidden relative w-full">
                <div id="marqueeContent" class="flex flex-row marquee-animation">
                    <!-- Items will be loaded from API and duplicated for seamless loop -->
                </div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-[#e5e5e5]/90 backdrop-blur px-10 py-4 rounded-full shadow-xl border border-white/20 flex space-x-12">
        <a href="dressing-room.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Dressing Room</a>
        <a href="wardrobe.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Wardrobe</a>
        <a href="index.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Home</a>
    </nav>

    <script>
        let selectedFile = null;
        let currentItemId = null;
        
        // Load saved items marquee when page loads
        window.addEventListener('DOMContentLoaded', () => {
            loadMarqueeItems();
        });
        
        // Load items for marquee
        async function loadMarqueeItems() {
            try {
                const data = await getItems({ limit: 20 });
                displayMarquee(data.items);
            } catch (error) {
                console.error('Failed to load marquee items:', error);
                // Hide marquee if no items
                document.getElementById('marqueeContent').innerHTML = '<p class="text-gray-400 text-xs uppercase">No items saved yet</p>';
            }
        }
        
        // Display items in marquee
        function displayMarquee(items) {
            const marquee = document.getElementById('marqueeContent');
            
            if (items.length === 0) {
                marquee.innerHTML = '<p class="text-gray-400 text-xs uppercase">No items saved yet</p>';
                marquee.classList.remove('marquee-animation');
                return;
            }
            
            // Create color backgrounds for items
            const colors = ['#000000', '#1A1A1A', '#333333', '#4D4D4D'];
            
            // Build HTML for items
            let itemsHTML = '';
            items.forEach((item, index) => {
                const bgColor = colors[index % colors.length];
                itemsHTML += `
                    <div class="marquee-item" style="background-color: ${bgColor};">
                        <img src="${getItemImageUrl(item.id, 'segmented')}" 
                             alt="${item.category}" 
                             title="${item.primary_color} ${item.category}">
                    </div>
                `;
            });
            
            // Duplicate items for seamless loop
            marquee.innerHTML = itemsHTML + itemsHTML;
        }

        // Drag and drop handlers
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File selection handler
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        // Handle selected file
        function handleFile(file) {
            // Validate file type
            const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg', 'image/bmp'];
            if (!validTypes.includes(file.type)) {
                showError('Invalid file type. Please upload an image (JPG, PNG, WEBP)');
                return;
            }
            
            // Validate file size (10MB max)
            const maxSize = 10 * 1024 * 1024;
            if (file.size > maxSize) {
                showError('File too large. Maximum size is 10MB');
                return;
            }
            
            selectedFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewThumb').src = e.target.result;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
                document.getElementById('filePreview').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        // Start AI processing
        async function startProcessing() {
            if (!selectedFile) {
                showError('No file selected');
                return;
            }
            
            // Hide upload section, show loading
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';
            
            try {
                // Call API
                const result = await uploadItem(selectedFile);
                
                // Hide loading, show results
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'block';
                
                // Store item ID
                currentItemId = result.item_id;
                
                // Display AI results
                displayResults(result);
                
            } catch (error) {
                console.error('Upload error:', error);
                showError('Processing failed: ' + error.message);
                
                // Reset
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('uploadSection').style.display = 'block';
            }
        }

        // Display AI analysis results
        function displayResults(data) {
            // Category
            document.getElementById('aiCategory').textContent = data.category;
            document.getElementById('aiConfidence').textContent = `Confidence: ${formatConfidence(data.confidence)}`;
            
            // Primary color
            document.getElementById('primaryColorName').textContent = data.primary_color;
            document.getElementById('paletteType').textContent = data.palette_type;
            document.getElementById('primaryColorSwatch').style.backgroundColor = data.colors[0]?.hex || '#000000';
            
            // Segmented image
            document.getElementById('segmentedImage').src = `http://localhost:8000/api/items/${data.item_id}/image?type=segmented`;
            
            // Color breakdown
            const colorBreakdown = document.getElementById('colorBreakdown');
            colorBreakdown.innerHTML = '';
            
            data.colors.forEach(color => {
                colorBreakdown.innerHTML += `
                    <div class="flex items-center justify-between bg-white p-3 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-lg border border-gray-300" style="background-color: ${color.hex}"></div>
                            <div>
                                <p class="text-xs font-bold uppercase">${color.name}</p>
                                <p class="text-[10px] text-gray-500">${color.hex}</p>
                            </div>
                        </div>
                        <p class="text-sm font-black">${color.percentage.toFixed(1)}%</p>
                    </div>
                `;
            });
        }

        // Save user details
        async function saveItemDetails(event) {
            event.preventDefault();
            
            if (!currentItemId) {
                showError('No item to save');
                return;
            }
            
            const material = document.getElementById('material').value || null;
            const size = document.getElementById('size').value || null;
            const notes = document.getElementById('notes').value || null;
            
            try {
                await updateItem(currentItemId, {
                    material,
                    size,
                    notes
                });
                
                showSuccess('Item saved to wardrobe!');
                
                // Redirect to wardrobe after 1 second
                setTimeout(() => {
                    window.location.href = 'wardrobe.html';
                }, 1000);
                
            } catch (error) {
                showError('Failed to save: ' + error.message);
            }
        }

        // Reset and upload another
        function resetUpload() {
            selectedFile = null;
            currentItemId = null;
            
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('filePreview').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('userDataForm').reset();
        }
    </script>

</body>
</html>
